[package]
name = "mivi"
version = "0.0.14"
edition = "2021"
description = "MIVI-V2: Ultra-Compact Low-Resource Pure Rust Local AI Engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.10"
tower-http = { version = "0.5", features = ["cors"] }
colored = "2.1"
inquire = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1.0"
memmap2 = "0.9"
libc = "0.2"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.22", default-features = false, optional = true }
schoolmarm = { version = "0.1.1", optional = true }
shimmytok = "0.8.0"
rayon = "1.10"

[features]
default = ["native"]
native = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:schoolmarm"]
semantic-rag = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]


