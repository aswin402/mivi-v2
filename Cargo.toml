[package]
name = "mivi"
version = "0.0.9"
edition = "2021"
description = "MIVI-V2: Ultra-Compact Low-Resource Pure Rust Local AI Engine"

[workspace]
members = ["splitter"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.10"
tower-http = { version = "0.5", features = ["cors"] }
colored = "2.1"
inquire = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1.0"
memmap2 = "0.9"


